name: Cleanup Old Branches

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    
    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"

          # Delete only translation-sync branches
          if [[ $BRANCH_NAME == translation-sync-* ]]; then
            echo "Deleting branch: $BRANCH_NAME"
            if gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH_NAME"; then
              echo "Deleted branch: $BRANCH_NAME"
            else
              echo "Branch could not be deleted (maybe already deleted)"
            fi
          else
            echo "Branch $BRANCH_NAME is not a translation branch, skipping"
          fi
