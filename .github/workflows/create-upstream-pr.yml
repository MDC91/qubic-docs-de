name: Create Upstream PR

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-upstream-pr:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.title, '[REVIEW NEEDED]'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_PR_TOKEN }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "Qubic Translation Bot"
          git config user.email "translation-bot@qubic-network.de"

      - name: Add and fetch remotes
        run: |
          git remote add upstream https://github.com/qubic/docs.git || git remote set-url upstream https://github.com/qubic/docs.git
          git fetch upstream main
          git fetch origin main

      - name: Build translation-only branch
        id: prepare
        run: |
          BRANCH_NAME="german-translations-${{ github.run_id }}-${{ github.run_attempt }}"

          rm -rf /tmp/fork-i18n-de
          mkdir -p /tmp/fork-i18n-de

          # Backup translations from fork main
          git checkout --force origin/main
          if [ -d i18n/de ]; then
            cp -R i18n/de /tmp/fork-i18n-de/
          else
            echo "No i18n/de directory found in origin/main"
          fi

          # Start from upstream main, then copy only i18n/de
          git checkout --force -B "$BRANCH_NAME" upstream/main
          if [ ! -d /tmp/fork-i18n-de/de ]; then
            echo "::error title=Missing translations::No i18n/de directory found in origin/main."
            exit 1
          fi

          rm -rf i18n/de
          mkdir -p i18n
          cp -R /tmp/fork-i18n-de/de i18n/

          git add -A

          if git diff --cached --quiet; then
            echo "No translation changes to send upstream"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Add/Update German translations

          - Synced from ${{ github.repository }} after review
          - Includes only i18n/de content"

          git push -u origin "$BRANCH_NAME"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request to qubic/docs
        if: steps.prepare.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
        run: |
          gh pr create \
            --repo qubic/docs \
            --title "German Translation Update - $(date -u +%Y-%m-%d)" \
            --body "$(cat << 'PRBODY'
          ## German Translation Update

          This PR adds or updates German documentation translations.

          ### Included
          - Synced from `${{ github.repository }}`
          - Human-reviewed before upstream submission
          - Translation files only (`i18n/de/**`)
          - Scope currently limited to `overview` documents

          ### Notes
          - This workflow creates a clean branch from `qubic/docs:main`
          - It then copies only `i18n/de` from the fork
          - No workflow, script, or source files are included

          ---
          Automated by translation sync workflow.
          PRBODY
          )" \
            --head "${{ github.repository_owner }}:${{ steps.prepare.outputs.branch_name }}" \
            --base main

      - name: Notify no changes
        if: steps.prepare.outputs.has_changes != 'true'
        run: |
          echo "::notice title=No Changes::No new translation changes found for upstream PR."

      - name: Notify success
        if: steps.prepare.outputs.has_changes == 'true'
        run: |
          echo "========================================"
          echo "Upstream PR created successfully"
          echo "Includes only: i18n/de/**"
          echo "========================================"
